<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxelQuest Python Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; color: #fff; font-family: monospace; }
        #hud { position: fixed; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
        #hud div { margin-bottom: 4px; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; z-index: 15; }
        #menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 10px; }
        #menu button { font-size: 20px; padding: 12px 24px; margin: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>VoxelQuest Python</h1>
        <button onclick="startGame('solo')">🎮 Solitario</button>
        <button onclick="startGame('coop')">👥 2 Jugadores Split Screen</button>
    </div>
    <div id="hud">
        <div id="fps">FPS: 0</div>
        <div id="pos">Pos: -</div>
        <div id="mode">Modo: -</div>
    </div>
    <div id="loading" style="display:none">Conectando al servidor Python...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="client/js/net.js"></script>
    <script src="client/js/world_mesh.js"></script>
    <script src="client/js/input.js"></script>
    <script src="client/js/main.js"></script>
    <script>
        function startGame(mode) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            const url = new URL(window.location.href);
            url.searchParams.set('mode', mode);
            window.history.replaceState({}, '', url);
            const game = new ClientGame(mode);
            game.start();
        }
    </script>
</body>
</html>
