[project]
name = "voxelquest-server"
version = "0.1.0"
description = "Servidor autoritativo de VoxelQuest en Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "mcp>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "mcp>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
